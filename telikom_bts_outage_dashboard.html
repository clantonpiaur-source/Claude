const COLORS={Current:'#ef4444',New:'#f59e0b',Pending:'#eab308',Aging:'#3b82f6',Unspecified:'#9ca3af'};
const STATUS_DESC={Current:'Failed this month',New:'Within 24hrs',Pending:'Jan–last month',Aging:'Last year & older',Unspecified:'No status'};
const sites=DATA.sites;
const regions=[...new Set(sites.map(s=>s.region))];
const statuses=['Current','New','Pending','Aging','Unspecified'];
let active={region:new Set(regions),status:new Set(statuses),q:''};

const map=L.map('map',{preferCanvas:true}).setView([-6.5,146.5],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
 attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);
const cluster=L.markerClusterGroup({maxClusterRadius:45,spiderfyOnMaxZoom:true});
map.addLayer(cluster);
let markers=[];

function mk(s){
 const c=COLORS[s.status]||COLORS.Unspecified;
 const m=L.circleMarker([s.lat,s.lon],{radius:7,color:'#0b1118',weight:1.5,fillColor:c,fillOpacity:.95});
 const ap=s.approx?' <span class="warn">(approx.)</span>':'';
 m.bindPopup(`<div class="pt">${s.site}</div>
   <div><span class="lbl">Status</span> <b style="color:${c==='#eab308'||c==='#f59e0b'?'#a16207':c}">${s.status}</b> · ${STATUS_DESC[s.status]||''}</div>
   <div><span class="lbl">Region / Province</span> ${s.region} — ${s.province}</div>
   <div><span class="lbl">Fault</span> ${s.fault} &nbsp; <span class="lbl">Category</span> ${s.category}</div>
   <div><span class="lbl">Down since</span> ${s.date}</div>
   <div><span class="lbl">Coordinates</span> ${s.lat}, ${s.lon}${ap}</div>
   <div style="margin-top:5px;max-width:300px"><span class="lbl">RCA / Update</span><br>${s.rca}</div>`,{maxWidth:340});
 m._site=s; return m;
}
sites.forEach(s=>{s._m=mk(s);});

function visible(s){
 if(!active.region.has(s.region))return false;
 if(!active.status.has(s.status))return false;
 if(active.q){const t=(s.site+' '+s.province+' '+s.fault+' '+s.region).toLowerCase();if(!t.includes(active.q))return false;}
 return true;
}
function render(){
 cluster.clearLayers();
 const vis=sites.filter(visible);
 cluster.addLayers(vis.map(s=>s._m));
 // KPIs
 const by={};statuses.forEach(k=>by[k]=0);vis.forEach(s=>by[s.status]++);
 document.getElementById('kpis').innerHTML=
   `<div class="kpi"><b>${vis.length}</b><span>Shown</span></div>`+
   statuses.map(k=>`<div class="kpi"><b style="color:${COLORS[k]}">${by[k]}</b><span>${k}</span></div>`).join('');
 // list
 document.getElementById('lc').textContent='('+vis.length+')';
 const L2=vis.slice().sort((a,b)=>a.region.localeCompare(b.region)||a.site.localeCompare(b.site));
 document.getElementById('list').innerHTML=L2.map((s,i)=>
   `<div class="row" data-i="${sites.indexOf(s)}"><div class="nm">${s.site}
     <span class="badge" style="background:${COLORS[s.status]}">${s.status}</span></div>
    <div class="meta">${s.region} · ${s.province} · ${s.fault}</div></div>`).join('');
 document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{
   const s=sites[+r.dataset.i];map.setView([s.lat,s.lon],13);s._m.openPopup();});
}
// chips
document.getElementById('regions').innerHTML=regions.map(r=>
 `<span class="chip" data-r="${r}"><span class="dot" style="background:#22d3ee"></span>${r} <span class="count">(${sites.filter(s=>s.region===r).length})</span></span>`).join('');
document.getElementById('statuses').innerHTML=statuses.map(k=>
 `<span class="chip" data-s="${k}"><span class="dot" style="background:${COLORS[k]}"></span>${k} <span class="count">(${sites.filter(s=>s.status===k).length})</span></span>`).join('');
document.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{const r=c.dataset.r;
 if(active.region.has(r)){active.region.delete(r);c.classList.add('off');}else{active.region.add(r);c.classList.remove('off');}render();});
document.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{const s=c.dataset.s;
 if(active.status.has(s)){active.status.delete(s);c.classList.add('off');}else{active.status.add(s);c.classList.remove('off');}render();});
document.getElementById('q').oninput=e=>{active.q=e.target.value.toLowerCase().trim();render();};
document.getElementById('rc').textContent='('+sites.length+' sites total)';
const un=DATA.unmatched;
document.getElementById('foot').innerHTML=
 `<b>${sites.length}</b> outage sites mapped of <b>${sites.length+un.length}</b> in report.`+
 (un.length?`<br><span class="warn">${un.length} not located</span> (no coordinates in master list): `+
   un.map(u=>u.site).join(', '):'')+
 `<br>Markers coloured by ticket age. Click a site for full RCA. Approx. coords flagged in popup.`;
render();
const grp=L.featureGroup(sites.map(s=>s._m));
try{map.fitBounds(grp.getBounds().pad(0.05));}catch(e){}
</script>
</body>
</html>
